<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习室预约与学习打卡系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="side-brand">
            <div class="logo-mark">SR</div>
            <div>
                <div class="name">Study Room</div>
                <div class="sub">预约 · 签到 · 打卡</div>
            </div>
        </div>

        <div class="nav-group">
            <div class="nav-group-title">学习空间</div>
            <a class="nav-item" data-route="home" href="#/home"></a>
            <a class="nav-item" data-route="rooms" href="#/rooms"></a>
            <a class="nav-item" data-route="bookings" href="#/bookings"></a>
            <a class="nav-item" data-route="study" href="#/study"></a>
        </div>

        <div class="nav-group">
            <div class="nav-group-title">成长记录</div>
            <a class="nav-item" data-route="stats" href="#/stats"></a>
            <a class="nav-item" data-route="goals" href="#/goals"></a>
            <a class="nav-item" data-route="ranking" href="#/ranking"></a>
        </div>

        <div class="nav-group" id="adminNavGroup" style="display:none">
            <div class="nav-group-title">运营管理</div>
            <a class="nav-item" data-route="admin" href="#/admin"></a>
        </div>

        <div class="side-user">
            <div class="avatar" id="sideAvatar">?</div>
            <div class="who">
                <div class="n" id="sideName">--</div>
                <div class="r" id="sideRole">学生</div>
            </div>
            <button class="side-logout" id="logoutBtn" title="退出登录"></button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <button class="btn ghost sm menu-btn" id="menuBtn" title="菜单"></button>
            <div>
                <h1 id="pageTitle">学习概览</h1>
                <div class="crumb" id="pageCrumb">今天也要专注一点</div>
            </div>
            <div class="spacer"></div>
            <div class="clock" id="clock"></div>
        </div>
        <div class="view" id="view"></div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/rooms.js"></script>
<script src="js/pages/bookings.js"></script>
<script src="js/pages/study.js"></script>
<script src="js/pages/stats.js"></script>
<script src="js/pages/goals.js"></script>
<script src="js/pages/ranking.js"></script>
<script src="js/pages/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
